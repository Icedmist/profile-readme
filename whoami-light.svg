<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>snow@icedmist — zsh — 80×24 — expanded</title>
<rect width="900" height="300" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<!-- header -->
<rect width="900" height="38" rx="14" fill="#f6f8fa"/>
<rect y="26" width="900" height="12" fill="#f6f8fa"/>
<circle cx="26" cy="19" r="7" fill="#ff5f56"/>
<circle cx="48" cy="19" r="7" fill="#ffbd2e"/>
<circle cx="70" cy="19" r="7" fill="#27c93f"/>
<text x="100" y="23" font-family="monospace" font-size="11" fill="#57606a">snow@icedmist — zsh — 80×24</text>
<text x="760" y="23" font-family="monospace" font-size="10" fill="#57606a">● zsh</text>
<!-- left avatar — larger -->
<g id="avatar">
<circle cx="160" cy="160" r="64" fill="none" stroke="#16A534" stroke-opacity="0.2">
<animate attributeName="r" values="64;72;64" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle cx="160" cy="160" r="54" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="160" cy="160" r="46" fill="#ffffff" stroke="#16A534" stroke-width="2"/>
<text x="160" y="172" text-anchor="middle" font-size="34">❄️</text>
<text x="160" y="210" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#24292f">Icedmist</text>
<text x="160" y="224" text-anchor="middle" font-family="monospace" font-size="8" fill="#57606a">fastfetch + chafa</text>
</g>
<!-- divider -->
<line x1="300" y1="50" x2="300" y2="280" stroke="#d0d7de" stroke-opacity="0.4"/>
<!-- right code — larger, more spacious, 14px line height -->
<g id="code" font-family="monospace" font-size="13">
<text x="320" y="78" fill="#57606a" font-size="11">// $ fastfetch — $ chafa avatar.png --format symbols</text>
<text x="320" y="98" fill="#57606a" font-size="11">// $ silicon profile.js -o profile.png — $ onefetch</text>
<text x="320" y="128" fill="#58a6ff">const<tspan fill="#24292f"> </tspan><tspan fill="#ff7b72">snow</tspan><tspan fill="#24292f"> = {</tspan></text>
<text x="340" y="152" fill="#24292f">role: <tspan fill="#a5d6ff">"AI • Cloud • Automation"</tspan>,</text>
<text x="340" y="176" fill="#24292f">motto: <tspan fill="#a5d6ff">"Vendetta of a Gentleman"</tspan>,</text>
<text x="340" y="200" fill="#24292f">stack: [<tspan fill="#a5d6ff">"TypeScript"</tspan>, <tspan fill="#a5d6ff">"Python"</tspan>, <tspan fill="#a5d6ff">"Dart"</tspan>],</text>
<text x="340" y="224" fill="#24292f">focus: <tspan fill="#a5d6ff">"incremental, always-fresh systems"</tspan>,</text>
<text x="340" y="248" fill="#24292f">location: <tspan fill="#a5d6ff">"Gombe → Global"</tspan></text>
<text x="320" y="268" fill="#24292f">};</text>
<!-- blinking cursor larger -->
<rect x="338" y="256" width="10" height="14" fill="#16A534" opacity="0.9">
<animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
