<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img">
<style>
@media (prefers-color-scheme: light) {
  rect[fill="#0d1117"] { fill: #ffffff !important; }
  rect[fill="#161b22"] { fill: #f6f8fa !important; }
  rect[fill="#0d1117"][stroke="#30363d"] { stroke: #d0d7de !important; }
  text[fill="#c9d1d9"] { fill: #24292f !important; }
  text[fill="#8b949e"] { fill: #57606a !important; }
  text[fill="#24292f"] { fill: #24292f !important; }
  [stroke="#30363d"] { stroke: #d0d7de !important; }
  [fill="#30363d"] { fill: #d0d7de !important; }
  line[stroke="#30363d"] { stroke: #d0d7de !important; }
}
</style>

<title>Why this way? — 4 principles — explainable simple</title>
<rect width="900" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
<!-- header -->
<rect x="0" y="0" width="900" height="32" rx="12" fill="#161b22"/>
<text x="80" y="20" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b949e"> </text>
<text x="210" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">Principle</text>
<text x="600" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">In simple terms — what it means for you</text>
<!-- row 1 -->
<g id="r1">
<rect x="2" y="34" width="896" height="38" rx="8" fill="#161b22" stroke="#16A534" stroke-opacity="0.6">
<animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
</rect>
<text x="40" y="58" text-anchor="middle" font-size="14">⚡</text>
<text x="120" y="54" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">Sub-second</text>
<text x="120" y="68" font-family="monospace" font-size="8" fill="#8b949e">iteration</text>
<text x="280" y="54" font-family="monospace" font-size="9" fill="#c9d1d9">Ship the Δ, not the world.</text>
<text x="280" y="68" font-family="monospace" font-size="8" fill="#8b949e">Changes propagate in seconds, not batches → agents see fresh data, not yesterday's.</text>
</g>
<!-- row 2 -->
<g id="r2">
<rect x="2" y="74" width="896" height="38" rx="8" fill="#0d1117" stroke="#0e75b6" stroke-opacity="0.6">
<animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
</rect>
<text x="40" y="98" text-anchor="middle" font-size="14">💰</text>
<text x="120" y="94" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">10× cheaper</text>
<text x="120" y="108" font-family="monospace" font-size="8" fill="#8b949e">at scale</text>
<text x="280" y="94" font-family="monospace" font-size="9" fill="#c9d1d9">Only changed dots re-run — skip 99%.</text>
<text x="280" y="108" font-family="monospace" font-size="8" fill="#8b949e">10k rows → only 12 re-embed, you pay for 12, not 10k.</text>
</g>
<!-- row 3 -->
<g id="r3">
<rect x="2" y="114" width="896" height="38" rx="8" fill="#161b22" stroke="#16A534" stroke-opacity="0.6">
<animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
</rect>
<text x="40" y="138" text-anchor="middle" font-size="14">🔍</text>
<text x="120" y="134" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">Explainable</text>
<text x="120" y="148" font-family="monospace" font-size="8" fill="#8b949e">by default</text>
<text x="280" y="134" font-family="monospace" font-size="9" fill="#c9d1d9">Every output traces to its source row.</text>
<text x="280" y="148" font-family="monospace" font-size="8" fill="#8b949e">handbook.md L42 → vector — debuggable, auditable, regulator-friendly.</text>
</g>
<!-- row 4 -->
<g id="r4">
<rect x="2" y="154" width="896" height="38" rx="8" fill="#0d1117" stroke="#0e75b6" stroke-opacity="0.6">
<animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" begin="1.5s" repeatCount="indefinite"/>
</rect>
<text x="40" y="178" text-anchor="middle" font-size="14">🛡️</text>
<text x="120" y="174" font-family="monospace" font-size="9" font-weight="700" fill="#c9d1d9">Production-grade</text>
<text x="120" y="188" font-family="monospace" font-size="8" fill="#8b949e"></text>
<text x="280" y="174" font-family="monospace" font-size="9" fill="#c9d1d9">Retries, backoff, offline-first, no-data-loss.</text>
<text x="280" y="188" font-family="monospace" font-size="8" fill="#8b949e">One bad row never stalls the flow — DLQ isolates it.</text>
</g>
</svg>
