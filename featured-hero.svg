<text x="36" y="68" font-family="monospace" font-size="10" letter-spacing="1" fill="#8b949e">YOUR REPOS · GIT</text>
<text x="36" y="90" font-family="monospace" font-size="12" fill="#58a6ff">📁 device-beacon</text>
<text x="36" y="102" font-family="monospace" font-size="9" fill="#8b949e">Python · Wi-Fi BSSID → ~50m</text>
<text x="36" y="122" font-family="monospace" font-size="12" fill="#58a6ff">📁 nexafinal</text>
<text x="36" y="134" font-family="monospace" font-size="9" fill="#16A534">React 19 · Firebase</text>
<text x="36" y="154" font-family="monospace" font-size="12" fill="#58a6ff">📁 Evergreeners</text>
<text x="36" y="166" font-family="monospace" font-size="9" fill="#8b949e">heatmap · streak</text>
<text x="36" y="192" font-family="monospace" font-size="9" fill="#8b949e">commit <tspan fill="#16A534">a1f3c9</tspan> · main · now</text>
</g>

<!-- center glow + avatar -->
<g id="center">
<!-- pulsing glow -->
<circle cx="450" cy="130" r="52" fill="rgba(22,165,52,0.18)">
  <animate attributeName="r" values="48;56;48" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.18;0.32;0.18" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="130" r="36" fill="none" stroke="#16A534" stroke-opacity="0.35">
  <animate attributeName="r" values="36;42;36" dur="2.5s" repeatCount="indefinite"/>
</circle>
<!-- avatar placeholder circle with initials -->
<circle cx="450" cy="130" r="28" fill="#0d1117" stroke="#16A534" stroke-width="2"/>
<text x="450" y="137" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#c9d1d9">❄️</text>
<text x="450" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b949e">snow@icedmist</text>
<!-- animated Δ arrows -->
<text x="340" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#16A534">Δ +1
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
</text>
<text x="370" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">──
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
</text>
<text x="395" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#0e75b6">▶
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
</text>
<text x="505" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#0e75b6">+3
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
</text>
<text x="530" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">──
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
</text>
<text x="555" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#16A534">▶
  <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.3s" repeatCount="indefinite"/>
</text>
<text x="450" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b949e">only the Δ re-ships
  <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
</text>
</g>

