<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">Featured Builds — device-beacon · nexafinal · Evergreeners</title>
<rect width="900" height="280" rx="16" fill="#0d1117" stroke="#30363d"/>
<!-- header -->
