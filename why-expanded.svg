<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why this way? — expanded, meaningful, spacious</title>
<rect width="900" height="420" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="28" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#8b949e">WHY THIS WAY? — <tspan fill="#16A534">simple, not generic</tspan></text>
<text x="450" y="44" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8b949e">each pillar = one real benefit — with a small example you can feel</text>
<!-- Top left: Sub-second -->
<g id="w1">
<rect x="20" y="60" width="430" height="160" rx="14" fill="#161b22" stroke="#16A534" stroke-width="1.3">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="50" y="88" font-size="20">⏱️</text>
<text x="80" y="88" font-family="monospace" font-size="12" font-weight="700" fill="#16A534">Sub-second fresh</text>
<text x="80" y="102" font-family="monospace" font-size="8.5" fill="#8b949e">source → target in &lt;1s</text>
<rect x="50" y="118" width="370" height="28" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="60" y="136" font-family="monospace" font-size="8" fill="#8b949e">you edit</text>
<text x="120" y="136" font-family="monospace" font-size="8" fill="#c9d1d9">handbook.md</text>
<text x="210" y="136" font-family="monospace" font-size="8" fill="#16A534">—→</text>
<text x="230" y="136" font-family="monospace" font-size="8" fill="#0e75b6">agent sees it now</text>
<circle cx="70" cy="136" r="3" fill="#16A534"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="50" y="164" font-family="monospace" font-size="7.5" fill="#8b949e">Batch pipelines show yesterday. I show now.</text>
<text x="50" y="180" font-family="monospace" font-size="7" fill="#16A534">example: push → live in 0.8s, not next day</text>
</g>
<!-- Top right: 10× cheaper -->
<g id="w2">
<rect x="470" y="60" width="410" height="160" rx="14" fill="#161b22" stroke="#0e75b6" stroke-width="1.3">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.7s" repeatCount="indefinite"/>
</rect>
<text x="500" y="88" font-size="20">💰</text>
<text x="530" y="88" font-family="monospace" font-size="12" font-weight="700" fill="#0e75b6">10× cheaper at scale</text>
<text x="530" y="102" font-family="monospace" font-size="8.5" fill="#8b949e">only changed dots re-run</text>
<rect x="500" y="118" width="350" height="18" rx="9" fill="#0d1117" stroke="#30363d"/>
<rect x="500" y="118" width="28" height="18" rx="9" fill="#0e75b6"><animate attributeName="width" values="28;350;28" dur="4s" repeatCount="indefinite"/></rect>
<text x="505" y="130" font-family="monospace" font-size="7" fill="#0d1117">Δ 0.12% ——————— 99.88% cached</text>
<text x="500" y="152" font-family="monospace" font-size="7.5" fill="#8b949e">10,000 rows → only 12 re-embed.</text>
<text x="500" y="164" font-family="monospace" font-size="7" fill="#0e75b6">You pay for 12, not 10,000.</text>
<text x="500" y="180" font-family="monospace" font-size="7" fill="#8b949e">example: nightly job $12 → $1.20</text>
</g>
<!-- Bottom left: Explainable -->
<g id="w3">
<rect x="20" y="240" width="430" height="160" rx="14" fill="#161b22" stroke="#16A534" stroke-width="1.3">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.4s" repeatCount="indefinite"/>
</rect>
<text x="50" y="268" font-size="20">🔍</text>
<text x="80" y="268" font-family="monospace" font-size="12" font-weight="700" fill="#16A534">Explainable by default</text>
<text x="80" y="282" font-family="monospace" font-size="8.5" fill="#8b949e">every output traces to source</text>
<rect x="50" y="296" width="370" height="32" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="60" y="312" font-family="monospace" font-size="8" fill="#c9d1d9">handbook.md<sub style="font-size:6">L42</sub></text>
<text x="150" y="312" font-family="monospace" font-size="9" fill="#16A534">───▶</text>
<text x="180" y="312" font-family="monospace" font-size="8" fill="#0e75b6">vector #842</text>
<circle cx="60" cy="308" r="2.5" fill="#16A534"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
<circle cx="190" cy="308" r="2.5" fill="#0e75b6"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></circle>
<text x="50" y="334" font-family="monospace" font-size="7" fill="#8b949e">Debuggable, auditable, regulator-friendly.</text>
<text x="50" y="348" font-family="monospace" font-size="7" fill="#16A534">example: Why this vector? → L42</text>
</g>
<!-- Bottom right: Production-grade -->
<g id="w4">
<rect x="470" y="240" width="410" height="160" rx="14" fill="#161b22" stroke="#0e75b6" stroke-width="1.3">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/>
</rect>
<text x="500" y="268" font-size="20">🛡️</text>
<text x="530" y="268" font-family="monospace" font-size="12" font-weight="700" fill="#0e75b6">Production-grade</text>
<text x="530" y="282" font-family="monospace" font-size="8.5" fill="#8b949e">no bad row stalls the flow</text>
<rect x="500" y="296" width="350" height="32" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="510" y="312" font-family="monospace" font-size="7.5" fill="#c9d1d9">corrupt.pdf</text>
<text x="580" y="312" font-family="monospace" font-size="8" fill="#16A534">→ retry → backoff → DLQ</text>
<text x="700" y="312" font-family="monospace" font-size="7" fill="#8b949e">isolated</text>
<g fill="none" stroke="#0e75b6" stroke-width="1.1">
<circle cx="520" cy="328" r="6" stroke-opacity="0.7"><animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="328" r="6" stroke-opacity="0.7"><animate attributeName="r" values="6;10;6" dur="1.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="328" r="6" stroke-opacity="0.7"><animate attributeName="r" values="6;10;6" dur="1.8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></circle>
</g>
<text x="500" y="348" font-family="monospace" font-size="7" fill="#8b949e">One bad file → retry, not crash.</text>
<text x="500" y="360" font-family="monospace" font-size="7" fill="#0e75b6">example: 1/10k fails → 9,999 still ship</text>
</g>
</svg>
