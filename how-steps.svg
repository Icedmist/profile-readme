<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How I Build — 5 steps — animated explainable</title>
<rect width="900" height="340" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="26" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">HOW I BUILD — <tspan fill="#16A534">5 steps</tspan> — from idea to observability</text>
<!-- Step 01 -->
<g id="s1">
<rect x="20" y="44" width="860" height="52" rx="10" fill="#161b22" stroke="#16A534" stroke-width="1.2">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
</rect>
<text x="36" y="62" font-family="monospace" font-size="9" fill="#16A534">01 — Discover</text>
<text x="36" y="80" font-family="monospace" font-size="9" fill="#c9d1d9">Map the real problem, not the proxy</text>
<text x="36" y="92" font-family="monospace" font-size="8" fill="#8b949e">Interviews → <tspan fill="#0e75b6">Board → Hospitals → Depts</tspan> modeling</text>
<circle cx="840" cy="70" r="4" fill="#16A534"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="820" y="74" font-family="monospace" font-size="8" fill="#16A534">●</text>
</g>
<!-- Step 02 -->
<g id="s2">
<rect x="20" y="104" width="860" height="52" rx="10" fill="#161b22" stroke="#0e75b6" stroke-width="1.2">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.4s" repeatCount="indefinite"/>
</rect>
<text x="36" y="122" font-family="monospace" font-size="9" fill="#0e75b6">02 — Design</text>
<text x="36" y="140" font-family="monospace" font-size="9" fill="#c9d1d9">Minimal, explainable, offline-first</text>
<text x="36" y="152" font-family="monospace" font-size="8" fill="#8b949e">Figma → Tailwind, Firebase/Postgres schema</text>
<circle cx="840" cy="130" r="4" fill="#0e75b6"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
</g>
<!-- Step 03 -->
<g id="s3">
<rect x="20" y="164" width="860" height="52" rx="10" fill="#161b22" stroke="#16A534" stroke-width="1.2">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/>
</rect>
<text x="36" y="182" font-family="monospace" font-size="9" fill="#16A534">03 — Build</text>
<text x="36" y="200" font-family="monospace" font-size="9" fill="#c9d1d9">Parallel by default, incremental</text>
<text x="36" y="212" font-family="monospace" font-size="8" fill="#8b949e">TS/Python/Dart · React/Next.js · FastAPI · Flutter</text>
<circle cx="840" cy="190" r="4" fill="#16A534"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
</g>
<!-- Step 04 -->
<g id="s4">
<rect x="20" y="224" width="860" height="52" rx="10" fill="#161b22" stroke="#0e75b6" stroke-width="1.2">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="1.2s" repeatCount="indefinite"/>
</rect>
<text x="36" y="242" font-family="monospace" font-size="9" fill="#0e75b6">04 — Ship Δ</text>
<text x="36" y="260" font-family="monospace" font-size="9" fill="#c9d1d9">Only changed dots re-run</text>
<text x="36" y="272" font-family="monospace" font-size="8" fill="#8b949e">git · Docker · Vercel · Cloud Run</text>
<circle cx="840" cy="250" r="4" fill="#0e75b6"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="1.2s" repeatCount="indefinite"/></circle>
</g>
<!-- Step 05 -->
<g id="s5">
<rect x="20" y="284" width="860" height="52" rx="10" fill="#161b22" stroke="#16A534" stroke-width="1.2">
<animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="1.6s" repeatCount="indefinite"/>
</rect>
<text x="36" y="302" font-family="monospace" font-size="9" fill="#16A534">05 — Observe</text>
<text x="36" y="320" font-family="monospace" font-size="9" fill="#c9d1d9">Logs, telemetry, streaks</text>
<text x="36" y="332" font-family="monospace" font-size="8" fill="#8b949e">device-beacon style telemetry · Evergreeners heatmap</text>
<circle cx="840" cy="310" r="4" fill="#16A534"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="1.6s" repeatCount="indefinite"/></circle>
</g>
<!-- connecting line -->
<g stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
<path d="M 450 44 V 96"><animate attributeName="stroke-dashoffset" values="0;8" dur="1s" repeatCount="indefinite"/></path>
</g>
</svg>
