<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How I Build — Target = F(Idea)</title>
<rect width="900" height="340" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="26" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#8b949e">HOW I BUILD — <tspan fill="#16A534">Target = F(Idea)</tspan></text>
<text x="450" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b949e">declare the desired state — the engine keeps it fresh forever</text>
<!-- source files -->
<g id="sources">
<rect x="30" y="60" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="75" font-family="monospace" font-size="10" fill="#58a6ff">▸</text><text x="60" y="75" font-family="monospace" font-size="10" fill="#c9d1d9">idea.md</text><text x="150" y="75" font-family="monospace" font-size="8" fill="#8b949e">spec</text>
<rect x="30" y="104" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="119" font-family="monospace" font-size="10" fill="#58a6ff">▸</text><text x="60" y="119" font-family="monospace" font-size="10" fill="#c9d1d9">design.fig</text><text x="150" y="119" font-family="monospace" font-size="8" fill="#0e75b6">figma</text>
<rect x="30" y="148" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="163" font-family="monospace" font-size="10" fill="#58a6ff">▸</text><text x="60" y="163" font-family="monospace" font-size="10" fill="#c9d1d9">data.json</text><text x="150" y="163" font-family="monospace" font-size="8" fill="#16A534">live</text>
</g>
<!-- arrows to F -->
<g stroke="#30363d" stroke-width="1.2" fill="none" stroke-dasharray="6 6">
<path d="M190 78 H 360"><animate attributeName="stroke-dashoffset" values="0;12" dur="1.2s" repeatCount="indefinite"/></path>
<path d="M190 122 H 360"><animate attributeName="stroke-dashoffset" values="0;12" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></path>
<path d="M190 166 H 360"><animate attributeName="stroke-dashoffset" values="0;12" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></path>
</g>
<!-- F function -->
<g id="f">
<rect x="360" y="82" width="180" height="96" rx="12" fill="#161b22" stroke="#16A534" stroke-width="1.2"/>
<circle cx="450" cy="100" r="22" fill="none" stroke="#16A534" stroke-opacity="0.3">
<animate attributeName="r" values="22;28;22" dur="2.4s" repeatCount="indefinite"/>
<animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="450" y="106" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#16A534">F()</text>
<text x="450" y="126" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">your code — simple</text>
<text x="450" y="140" text-anchor="middle" font-family="monospace" font-size="8" fill="#c9d1d9">as the one-off version</text>
<text x="450" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#0e75b6">engine does the rest</text>
</g>
<!-- arrow to target -->
<g stroke="#16A534" stroke-width="1.4" fill="none" stroke-dasharray="8 6">
<path d="M540 130 H 620"><animate attributeName="stroke-dashoffset" values="0;14" dur="1s" repeatCount="indefinite"/></path>
</g>
<text x="580" y="126" text-anchor="middle" font-family="monospace" font-size="9" fill="#16A534">Δ only</text>
<!-- target dots matrix -->
<g id="target">
<text x="700" y="68" font-family="monospace" font-size="9" letter-spacing="1" fill="#8b949e">TARGET — LIVE</text>
<g fill="#30363d">
<circle cx="640" cy="100" r="6" fill="#0e75b6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="670" cy="100" r="6" fill="#30363d"/><circle cx="700" cy="100" r="6" fill="#30363d"/><circle cx="730" cy="100" r="6" fill="#30363d"/><circle cx="760" cy="100" r="6" fill="#16A534"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="124" r="6" fill="#30363d"/><circle cx="670" cy="124" r="6" fill="#16A534"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/></circle><circle cx="700" cy="124" r="6" fill="#0e75b6"/><circle cx="730" cy="124" r="6" fill="#30363d"/><circle cx="760" cy="124" r="6" fill="#30363d"/>
<circle cx="640" cy="148" r="6" fill="#30363d"/><circle cx="670" cy="148" r="6" fill="#30363d"/><circle cx="700" cy="148" r="6" fill="#30363d"/><circle cx="730" cy="148" r="6" fill="#0e75b6"/><circle cx="760" cy="148" r="6" fill="#30363d"/>
</g>
<text x="700" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">every dot traces to its source byte</text>
</g>
<!-- bottom props -->
<g font-family="monospace" font-size="8" text-anchor="middle">
<text x="180" y="230" fill="#0e75b6">Python <tspan fill="#8b949e">not DAG</tspan></text>
<text x="360" y="230" fill="#16A534">● declare <tspan fill="#8b949e">target state</tspan></text>
<text x="540" y="230" fill="#0e75b6">— lineage <tspan fill="#8b949e">end-to-end</tspan></text>
<text x="720" y="230" fill="#16A534">Δ+1 <tspan fill="#8b949e">at any scale</tspan></text>
</g>
</svg>
