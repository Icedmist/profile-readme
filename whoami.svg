<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img">
<style>
@media (prefers-color-scheme: light) {
  rect[fill="#0d1117"] { fill: #ffffff !important; }
  rect[fill="#161b22"] { fill: #f6f8fa !important; }
  rect[fill="#0d1117"][stroke="#30363d"] { stroke: #d0d7de !important; }
  text[fill="#c9d1d9"] { fill: #24292f !important; }
  text[fill="#8b949e"] { fill: #57606a !important; }
  text[fill="#24292f"] { fill: #24292f !important; }
  [stroke="#30363d"] { stroke: #d0d7de !important; }
  [fill="#30363d"] { fill: #d0d7de !important; }
  line[stroke="#30363d"] { stroke: #d0d7de !important; }
}
</style>

<title>snow@icedmist — zsh — 80×24 — expanded</title>
<rect width="900" height="300" rx="14" fill="#0d1117" stroke="#30363d"/>
<!-- header -->
<rect width="900" height="38" rx="14" fill="#161b22"/>
<rect y="26" width="900" height="12" fill="#161b22"/>
<circle cx="26" cy="19" r="7" fill="#ff5f56"/>
<circle cx="48" cy="19" r="7" fill="#ffbd2e"/>
<circle cx="70" cy="19" r="7" fill="#27c93f"/>
<text x="100" y="23" font-family="monospace" font-size="11" fill="#8b949e">snow@icedmist — zsh — 80×24</text>
<text x="760" y="23" font-family="monospace" font-size="10" fill="#8b949e">● zsh</text>
<!-- left avatar — larger -->
<g id="avatar">
<circle cx="160" cy="160" r="64" fill="none" stroke="#16A534" stroke-opacity="0.2">
<animate attributeName="r" values="64;72;64" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle cx="160" cy="160" r="54" fill="#161b22" stroke="#30363d"/>
<circle cx="160" cy="160" r="46" fill="#0d1117" stroke="#16A534" stroke-width="2"/>
<text x="160" y="172" text-anchor="middle" font-size="34">❄️</text>
<text x="160" y="210" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#c9d1d9">Icedmist</text>
<text x="160" y="224" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b949e">fastfetch + chafa</text>
</g>
<!-- divider -->
<line x1="300" y1="50" x2="300" y2="280" stroke="#30363d" stroke-opacity="0.4"/>
<!-- right code — larger, more spacious, 14px line height -->
<g id="code" font-family="monospace" font-size="13">
<text x="320" y="78" fill="#8b949e" font-size="11">// $ fastfetch — $ chafa avatar.png --format symbols</text>
<text x="320" y="98" fill="#8b949e" font-size="11">// $ silicon profile.js -o profile.png — $ onefetch</text>
<text x="320" y="128" fill="#58a6ff">const<tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">snow</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
<text x="340" y="152" fill="#c9d1d9">role: <tspan fill="#a5d6ff">"AI • Cloud • Automation"</tspan>,</text>
<text x="340" y="176" fill="#c9d1d9">motto: <tspan fill="#a5d6ff">"Vendetta of a Gentleman"</tspan>,</text>
<text x="340" y="200" fill="#c9d1d9">stack: [<tspan fill="#a5d6ff">"TypeScript"</tspan>, <tspan fill="#a5d6ff">"Python"</tspan>, <tspan fill="#a5d6ff">"Dart"</tspan>],</text>
<text x="340" y="224" fill="#c9d1d9">focus: <tspan fill="#a5d6ff">"incremental, always-fresh systems"</tspan>,</text>
<text x="340" y="248" fill="#c9d1d9">location: <tspan fill="#a5d6ff">"Gombe → Global"</tspan></text>
<text x="320" y="268" fill="#c9d1d9">};</text>
<!-- blinking cursor larger -->
<rect x="338" y="256" width="10" height="14" fill="#16A534" opacity="0.9">
<animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
